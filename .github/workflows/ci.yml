name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Not here: the Rust timing budget, which is wall-clock noise on a shared VM and runs in the
# local `perf`/`smoke` loop, and the DMG, which release.yml builds from every green main.
jobs:
  core:
    # Portable Rust, so a Linux runner, in parallel with the macOS build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Rust core tests
        run: cargo test --manifest-path core/Cargo.toml

  app:
    # Mako uses macOS 26 APIs (NSGlassEffectView), so it needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build and bundle the app
        run: script/bundle

      - name: Compile the verification harness
        # Reuses the SDK modules the app build just compiled; most of a cold compile is those.
        run: |
          swiftc -O -module-cache-path "$(swift build -c release --show-bin-path)/ModuleCache" \
            .claude/skills/verify-mako/scripts/makoctl.swift -o "$RUNNER_TEMP/makoctl"

      - name: Control docs cover every command
        run: .claude/skills/verify-mako/scripts/doc-check
