name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Mako uses macOS 26 APIs (NSGlassEffectView), so it needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Rust core tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Rust core performance budget (release build)
        run: cargo test --release --manifest-path core/Cargo.toml -- --ignored --nocapture perf_budget

      - name: Build and bundle the app
        run: script/bundle

      - name: Package the DMG
        run: script/dmg

      - name: Compile the verification harness
        run: swiftc -O .claude/skills/verify-mako/scripts/makoctl.swift -o "$RUNNER_TEMP/makoctl"

      - name: Control docs cover every command
        run: .claude/skills/verify-mako/scripts/doc-check
